name: Test Template on PR

on:
  pull_request:
    branches:
      - template

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: template
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: ${{ github.workspace }}/template
          version: "latest"
          python-version: "3.13"

      # Use the Copier pinned in uv.lock so the renderer can't drift between runs.
      - name: Render template
        run: |
          mkdir ${{ github.workspace }}/rendered-project
          cd ${{ github.workspace }}/template
          uv run --locked copier copy \
            --trust \
            --overwrite \
            --defaults \
            -d description="Add your description here" \
            -d include_dockerfile=true \
            -d module_name=postmodern \
            -d project_name=postmodern-python \
            -d python_version=3.13 \
            -d user_email=you@example.com \
            -d user_name="Your Name" \
            . ../rendered-project/

      - name: Test rendered project
        working-directory: ${{ github.workspace }}/rendered-project
        run: |
          uv sync --all-extras --locked
          uv run --locked poe ci:fmt
          uv run --locked poe ci:lint
          uv run --locked poe ci:deps
          uv run --locked poe check
          uv run --locked poe test
